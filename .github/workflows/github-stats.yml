name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: LockedKey27
          outputs: |
            assets/contribution-graph.svg
            assets/contribution-graph-dark.svg?palette=github-dark

      - name: Commit generated graph
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update GitHub contribution graph"
          add: "assets/"
